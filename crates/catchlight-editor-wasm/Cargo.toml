[package]
name = "catchlight-editor-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The browser boundary for the catchlight editor: one wasm-bindgen surface over the editor server"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
catchlight-core = { workspace = true }
# For `manifest_requirements`: reading a manifest is a pure function, and the
# tab needs the answer without a session.
catchlight-editor-core = { workspace = true }
catchlight-editor-server = { workspace = true }
catchlight-editor-protocol = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Only to author a one-pixel PNG for the texture tests; nothing in the crate
# decodes an image.
image = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = "0.1"
# The GPU half: the device, the render cache and the viewport. Browser-only by
# construction — a wgpu surface comes from a canvas — so it is not in the
# crate's native build and neither is its cost.
catchlight-wgpu = { workspace = true }
# `webgl` so a browser with no WebGPU still draws. Under resolver 2 this
# feature reaches wgpu only on wasm32 builds; a native `cargo test` still gets
# a wgpu with no GL backend forced on, which is what keeps
# `create_headless_context`'s `Backends::PRIMARY` note true.
wgpu = { workspace = true, features = ["webgl"] }
glam = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "HtmlCanvasElement",
    "console",
    # The WebGL2 tier: a canvas made here rather than found, and a viewport
    # that copies the frame into its element's 2d context and reads it back.
    "Document",
    "Element",
    "CanvasRenderingContext2d",
    "ImageData",
] }

[lints]
workspace = true

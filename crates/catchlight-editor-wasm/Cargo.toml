[package]
name = "catchlight-editor-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The browser boundary for the catchlight editor: one wasm-bindgen surface over the editor server"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
catchlight-core = { workspace = true }
# For `manifest_requirements`: reading a manifest is a pure function, and the
# tab needs the answer without a session.
catchlight-editor-core = { workspace = true }
catchlight-editor-server = { workspace = true }
catchlight-editor-protocol = { workspace = true }
# Registered where a replica is built, so the tab checks them as the editor does.
catchlight-extension-animations = { workspace = true }
catchlight-extension-expressions = { workspace = true }
catchlight-extension-humanoid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# Only to author a one-pixel PNG for the texture tests; nothing in the crate
# decodes an image.
image = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = "0.1"
# Browser-only: a wgpu surface comes from a canvas.
catchlight-wgpu = { workspace = true }
# `webgl` so a browser with no WebGPU still draws. Under resolver 2 this
# reaches wgpu only on wasm32, so native tests get no forced GL backend.
wgpu = { workspace = true, features = ["webgl"] }
glam = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "HtmlCanvasElement",
    "console",
    # The WebGL2 tier.
    "Document",
    "Element",
    "CanvasRenderingContext2d",
    "ImageData",
] }

[lints]
workspace = true

[package]
name = "catchlight-editor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Thin client for the catchlight editor server: drives an editing session over the Unix socket"

[dependencies]
catchlight-editor-protocol.workspace = true
catchlight-editor-discovery.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
# The multipart boundary over HTTP must not occur in the bytes it frames.
getrandom.workspace = true
# Names each `review listen` registration file by its editor, session and agent.
sha2.workspace = true

[features]
# A harness adapter that appends each notice to the file named by
# CATCHLIGHT_FAKE_HARNESS. Only `catchlight-editor`'s tests turn it on.
fake-harness = []

[lints]
workspace = true

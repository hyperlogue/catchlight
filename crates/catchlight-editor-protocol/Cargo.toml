[package]
name = "catchlight-editor-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire types for the catchlight editor: transport-agnostic request/reply/event over newline-delimited JSON"

[dependencies]
# For the Id types: the wire names a node, param or texture by the same
# validated string the model file stores, so there is one definition of what
# an Id is rather than two that can drift.
catchlight-core = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

[package]
name = "catchlight-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The Catchlight editor as one program: serves the web editor on localhost and lets local agents drive it from the command line"
# `ui/` is generated by `cargo xtask bundle-ui` and ignored by git; naming it
# here is what puts it in the published crate, which `cargo install` builds
# without wasm-bindgen or Vite.
include = [
    "build.rs",
    "src/**",
    "ui/**",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "THIRD-PARTY-NOTICES.md",
]

[[bin]]
name = "catchlight-editor"
path = "src/main.rs"

[dependencies]
catchlight-editor-server.workspace = true
catchlight-editor-protocol.workspace = true
catchlight-editor-cli.workspace = true
anyhow.workspace = true
serde_json.workspace = true

# A signal removes the connection file instead of leaving it stale, and the
# exit code names the signal.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[target.'cfg(not(unix))'.dependencies]
ctrlc = { workspace = true, features = ["termination"] }

[dev-dependencies]
# Notices go to a file instead of a harness, for tests/review_listen.rs.
catchlight-editor-cli = { workspace = true, features = ["fake-harness"] }

# `cargo binstall catchlight-editor` fetches the release archive instead of
# building; the names are the ones `scripts/release/editor_app.py` writes.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints]
workspace = true

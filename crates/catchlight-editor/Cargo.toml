[package]
name = "catchlight-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The catchlight editor GUI (egui): one codebase for desktop (embeds the server + socket) and web (wasm via eframe WebRunner)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
catchlight-editor-server = { workspace = true }
catchlight-editor-protocol = { workspace = true }
# The viewport renders the puppet on eframe's own wgpu device (shared with
# egui-wgpu, since both are wgpu 29), so it needs catchlight's renderer + the
# wgpu/glam types directly. No readback: the rendered texture is handed to egui
# by id.
catchlight-wgpu = { workspace = true }
catchlight-core = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
eframe = "0.34.3"
rfd = "0.17.2"
catchlight-editor-core.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "Document",
  "Element",
  "File",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetFileOptions",
  "FileSystemWritableFileStream",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "Navigator",
  "Response",
  "StorageManager",
  "Url",
  "Window",
]

[lints]
workspace = true

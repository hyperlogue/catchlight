name: Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a running one finishes rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The bundled Lan model is a Git LFS object; fetch its actual bytes.
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      - uses: actions/configure-pages@v6
      - run: nix develop -c cargo xtask build-wasm
      - run: nix develop -c bun install --frozen-lockfile
      # Pages serves under /<repo>/, which every asset URL has to carry.
      - run: nix develop -c bun run --filter catchlight-demo build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  # Listing artifacts in the uploading job can miss the fresh upload. Re-run
  # only this job after a failure; re-running the build duplicates the artifact.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

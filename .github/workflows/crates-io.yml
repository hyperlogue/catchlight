name: Publish Rust crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check packages without publishing to crates.io
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      rust_version: ${{ steps.verify.outputs.rust_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/release/check.py
      - name: Check release tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          expected = f"refs/tags/v{version}"
          if os.environ["RELEASE_REF"] != expected:
              raise SystemExit(f"Publishing requires selecting the {expected} tag")
          PY
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Verify release packages
        id: verify
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          bash .github/scripts/publish-crates.sh dry-run
          rustc -V | awk '{print "rust_version=" $2}' >> "$GITHUB_OUTPUT"

  publish:
    if: ${{ !inputs.dry_run }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the verified Rust release
        env:
          RUST_VERSION: ${{ needs.verify.outputs.rust_version }}
        run: |
          [[ $RUST_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Upload verified versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash .github/scripts/publish-crates.sh publish

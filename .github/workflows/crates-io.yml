name: Publish Rust crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check packages without publishing to crates.io
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check release tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          expected = f"refs/tags/v{version}"
          if os.environ["RELEASE_REF"] != expected:
              raise SystemExit(f"Publishing requires selecting the {expected} tag")
          PY
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      - name: Verify all release packages
        run: nix develop -c bash .github/scripts/publish-crates.sh dry-run
      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: nix develop -c bash .github/scripts/publish-crates.sh publish

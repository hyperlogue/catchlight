name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_BACKTRACE: 1

# Linux jobs run cargo through `nix develop -c` to match local development.
jobs:
  release-version:
    name: shared release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/release/check.py
      - run: python3 -m unittest discover -s scripts/release

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix develop -c cargo deny check

  lint:
    name: clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: nix develop -c cargo clippy --workspace --all-targets --features catchlight-importer/cli -- -D warnings
      - name: runtime entry point and optional integrations
        run: |
          nix develop -c cargo test -p catchlight --doc
          nix develop -c cargo check -p catchlight --all-features
      - name: rustfmt
        run: nix develop -c cargo fmt --all --check

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      # Model fixtures and render baselines are LFS objects.
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      # The GPU suites run on the dev shell's lavapipe.
      - run: nix develop -c cargo test --workspace --features catchlight-importer/cli

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      # The editor runs in a browser, so everything under it must keep
      # compiling for wasm32, including the editor server's storage seam.
      - run: nix develop -c cargo build --target wasm32-unknown-unknown -p catchlight --features catchlight/wgpu -p catchlight-core -p catchlight-wgpu -p catchlight-importer -p catchlight-editor-server -p catchlight-editor-wasm
      # Cargo unifies features, so check the protocol's `ts` feature (enabled
      # by xtask) does not leak into a shipped artifact.
      - name: the browser bundle carries no codegen dependency
        run: |
          if nix develop -c cargo tree --target wasm32-unknown-unknown \
               -p catchlight-editor-wasm -e normal,build | grep -q 'ts-rs'; then
            echo "ts-rs reached the wasm build; the ts feature is leaking" >&2
            exit 1
          fi

  web:
    name: web workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      - run: nix develop -c cargo xtask build-wasm --release
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run typecheck
      - run: nix develop -c bun test
      - name: npm package consumers
        run: |
          nix develop -c bun run npm:pack
          nix develop -c bun run npm:verify
      - run: nix develop -c bun run --filter catchlight-demo build
      - run: nix develop -c cargo build -p catchlight-editor-server -p catchlight-editor-cli
      - run: nix develop -c bash -c 'cd python && uv run pytest -q'
      - run: nix develop -c cargo xtask bundle-ui
      - run: nix develop -c cargo build -p catchlight-editor
      - name: launcher E2E
        run: nix develop -c bun run --filter catchlight-local-editor e2e
      - name: browser E2E (Lan, both backends and graphics tiers)
        run: nix develop -c bun run --filter catchlight-demo e2e

  editor-native:
    name: editor tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      # The HTTP door, connection file and cli transport differ per OS.
      - run: cargo +stable test --locked -p catchlight-editor-cli -p catchlight-editor
      # Previews need a GPU adapter, which these runners do not promise.
      - run: cargo +stable test --locked -p catchlight-editor-server --bin catchlight-editor-server --test http_ws -- --skip payload
      - run: cargo +stable test --locked -p catchlight-editor-server --lib connection

  packages:
    name: nix packages
    runs-on: ubuntu-latest
    steps:
      # No `lfs: true`: the flake's source filter keeps compile-time assets,
      # including the CLI schema example, but excludes the LFS model fixtures.
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix build --print-build-logs .#catchlight-editor-server .#catchlight-cli .#catchlight-editor-cli .#catchlight-importer

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_BACKTRACE: 1

# Every job runs its cargo through `nix develop -c`, so the toolchain, the
# linker and the runtime libraries are exactly the ones `nix/shell.nix` pins
# for local development. Linux only: catchlight-editor-cli talks over a Unix
# socket, so there is nothing to gain from a Windows or macOS runner yet.
jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix develop -c cargo deny check

  lint:
    name: clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: rustfmt
        run: nix develop -c cargo fmt --all --check

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      # The editor runs in a browser, so everything under it has to keep
      # compiling for wasm32. The editor server is on this list because the
      # storage seam is what put it there: a `path` is a storage key rather
      # than a filesystem path, and nothing may quietly reintroduce a
      # filesystem call that only builds natively.
      - run: nix develop -c cargo build --target wasm32-unknown-unknown -p catchlight-core -p catchlight-wgpu -p catchlight-inx-importer -p catchlight-editor-server -p catchlight-editor-wasm
      # `xtask` turns the protocol crate's `ts` feature on, and Cargo unifies
      # features across a build — so this asserts the unification stops at the
      # workspace boundary and no shipped artifact links the code generator.
      - name: the browser bundle carries no codegen dependency
        run: |
          if nix develop -c cargo tree --target wasm32-unknown-unknown \
               -p catchlight-editor-wasm -e normal,build | grep -q 'ts-rs'; then
            echo "ts-rs reached the wasm build; the ts feature is leaking" >&2
            exit 1
          fi

  web:
    name: web workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      # The TypeScript wire types are generated from the Rust enums and
      # committed. The generator's own tests regenerate and byte-compare, and
      # hold the command classification to the enum; they are the one guard,
      # run here as the same `cargo test` a contributor runs locally. The
      # fixture tests are skipped because they belong to the model fixtures
      # rather than to the generator, and `cargo test --workspace` owns them.
      - name: protocol types are current
        run: nix develop -c cargo test -p xtask -- --skip 'fixtures::'
      # The site imports `@catchlight/wasm`, so the generated package has to
      # exist before anything typechecks or builds against it.
      - run: nix develop -c cargo xtask build-wasm --debug
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run typecheck
      - run: nix develop -c bun test
      - run: nix develop -c bun run --filter catchlight-demo build
      # Python integration tests launch the native editor server and CLI.
      - run: nix develop -c cargo build -p catchlight-editor-server -p catchlight-editor-cli
      # The Python client launches that server binary once per test and saves a
      # model the editor's own reader opens back, so it runs here, not in a job
      # of its own.
      - run: nix develop -c bash -c 'cd python && uv run pytest -q'
      # Visual E2E requires the private Lan model and runs locally with E2E_MODEL.
      # It is never fetched or published by this public workflow.

  packages:
    name: nix packages
    runs-on: ubuntu-latest
    steps:
      # No `lfs: true`: the flake's source filter keeps compile-time assets,
      # including the CLI schema example, but excludes the LFS model fixtures.
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      # The three shipped binaries, built from the flake so the packaging
      # cannot rot while the workspace moves under it.
      - run: nix build --print-build-logs .#catchlight-editor-server .#catchlight-cli .#catchlight-editor-cli

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUST_BACKTRACE: 1

# Every job runs its cargo through `nix develop -c`, so the toolchain, the
# linker and the runtime libraries are exactly the ones `nix/shell.nix` pins
# for local development. Linux only: catchlight-editor-cli talks over a Unix
# socket, so there is nothing to gain from a Windows or macOS runner yet.
jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix develop -c cargo deny check

  lint:
    name: clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: rustfmt
        run: nix develop -c cargo fmt --all --check

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: Swatinem/rust-cache@v2
      # The editor has to run in a browser, so the core and the wgpu backend
      # must keep compiling for wasm32 even though nothing here links them
      # into a bundle yet.
      - run: nix develop -c cargo build -p catchlight-core -p catchlight-wgpu --target wasm32-unknown-unknown

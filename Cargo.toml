[workspace]
resolver = "3"
members = [
    "crates/catchlight",
    "crates/catchlight-core",
    "crates/catchlight-extension-animations",
    "crates/catchlight-extension-humanoid",
    "crates/catchlight-extension-expressions",
    "crates/catchlight-importer",
    "crates/catchlight-cli",
    "crates/catchlight-editor-core",
    "crates/catchlight-editor-protocol",
    "crates/catchlight-editor-server",
    "crates/catchlight-editor-cli",
    "crates/catchlight-editor",
    "crates/catchlight-editor-wasm",
    "crates/catchlight-wgpu",
    "crates/visual-tests",
    "crates/xtask",
    "crates/catchlight-bevy",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hyperlogue/catchlight"
keywords = ["animation", "2d", "character", "rigging", "gamedev"]
categories = ["graphics", "game-development"]

[workspace.dependencies]
# Internal crates. The `version` is not redundant with `path`: publishing to
# crates.io requires it, and without it these read as `*` requirements, which
# `cargo deny check bans` rejects. Keep it in step with `workspace.package`.
catchlight-core = { path = "crates/catchlight-core", version = "0.4.0" }
catchlight-extension-animations = { path = "crates/catchlight-extension-animations", version = "0.4.0" }
catchlight-extension-humanoid = { path = "crates/catchlight-extension-humanoid", version = "0.4.0" }
catchlight-extension-expressions = { path = "crates/catchlight-extension-expressions", version = "0.4.0" }
catchlight-importer = { path = "crates/catchlight-importer", version = "0.4.0" }
catchlight-editor-core = { path = "crates/catchlight-editor-core", version = "0.4.0" }
catchlight-editor-protocol = { path = "crates/catchlight-editor-protocol", version = "0.4.0" }
catchlight-editor-server = { path = "crates/catchlight-editor-server", version = "0.4.0" }
catchlight-editor-cli = { path = "crates/catchlight-editor-cli", version = "0.4.0" }
catchlight-wgpu = { path = "crates/catchlight-wgpu", version = "0.4.0" }
catchlight-bevy = { path = "crates/catchlight-bevy", version = "0.4.0" }

# Data structures
smallvec = { version = "1.15", features = ["union"] }
bytemuck = "1.25.2"

# Math. Pinned to bevy's glam, not the crates.io latest.
glam = { version = "0.32", features = ["serde", "bytemuck"] }

# Rendering. Held at bevy's wgpu: catchlight-bevy hands bevy's render world a
# Device/Queue built by catchlight-wgpu, so the whole tree must resolve to a
# single wgpu -- if it splits, the failure is a type mismatch between two
# identically named `wgpu::Device`s at the plugin boundary. See
# `crates/catchlight-bevy/src/lib.rs`.
wgpu = "29"

# Image processing
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "tga",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11.19"
ciborium = "0.2.2"
schemars = "1"
base64 = "0.22"
sha2 = "0.11"
getrandom = "0.3"

# Command lines
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
# Tells the launcher which signal stopped it, which `ctrlc` does not.
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
tempfile = "3"
rustix = "1"

# TypeScript declarations generated from the Rust wire types. Off by default
# and behind the `ts` feature on the two crates that carry those types: it is a
# build-time tool for `cargo xtask generate`, never something a consumer links.
ts-rs = { version = "12.0", default-features = false, features = [
    "serde-compat",
    "no-serde-warnings",
] }

# The browser boundary. Pinned exactly: the generated glue only loads under the
# `wasm-bindgen` CLI of the same version, and the CLI comes from the dev shell's
# nixpkgs pin. Bump both together or the build fails naming both versions.
wasm-bindgen = "=0.2.121"
# The browser APIs the viewport needs: a canvas to draw on, and the frame clock
# to draw against. Only `catchlight-editor-wasm` uses them, and only on wasm32.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
wgpu-profiler = "0.27"

# Windowing
winit = "0.30"
pollster = "0.3"

# There is no unsafe anywhere, and the discipline that keeps it that way is
# derived `bytemuck::Pod` for every GPU-uploaded struct and no hand-written
# `Send`/`Sync`. Code that wants unsafe needs a different design, not an allow.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
redundant_lifetimes = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Every allowance says why it is there, and `#[expect]` is preferred so a
# stale one is reported.
allow_attributes_without_reason = "warn"
use_self = "warn"
redundant_clone = "warn"
cast_lossless = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
uninlined_format_args = "warn"
explicit_iter_loop = "warn"
checked_conversions = "warn"
unnested_or_patterns = "warn"
ignored_unit_patterns = "warn"
derive_partial_eq_without_eq = "warn"
manual_let_else = "warn"
needless_continue = "warn"
iter_on_single_items = "warn"
assigning_clones = "warn"
or_fun_call = "warn"
doc_markdown = "warn"
match_bool = "warn"
if_not_else = "warn"
enum_glob_use = "warn"

# Size-optimized profile for a future wasm bundle. Kept separate so the
# default `release` profile stays untouched.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1

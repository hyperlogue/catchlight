[workspace]
resolver = "2"
members = [
    "crates/catchlight-core",
    "crates/catchlight-clm",
    "crates/catchlight-editor-core",
    "crates/catchlight-editor-protocol",
    "crates/catchlight-editor-server",
    "crates/catchlight-editor-cli",
    "crates/catchlight-editor",
    "crates/catchlight-wgpu",
    "crates/visual-tests",
    "crates/xtask",
    "crates/catchlight-bevy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hovo/catchlight"

[workspace.dependencies]
# Internal crates. The `version` is not redundant with `path`: publishing to
# crates.io requires it, and without it these read as `*` requirements, which
# `cargo deny check bans` rejects. Keep it in step with `workspace.package`.
catchlight-core = { path = "crates/catchlight-core", version = "0.1.0" }
catchlight-editor-core = { path = "crates/catchlight-editor-core", version = "0.1.0" }
catchlight-editor-protocol = { path = "crates/catchlight-editor-protocol", version = "0.1.0" }
catchlight-editor-server = { path = "crates/catchlight-editor-server", version = "0.1.0" }
catchlight-wgpu = { path = "crates/catchlight-wgpu", version = "0.1.0" }
catchlight-bevy = { path = "crates/catchlight-bevy", version = "0.1.0" }

# Data structures
indextree = "4.7"

# Math. Pinned to bevy's glam, not the crates.io latest.
glam = { version = "0.32", features = ["serde", "bytemuck"] }

# Rendering. Held at bevy's wgpu: catchlight-bevy hands bevy's render world a
# Device/Queue built by catchlight-wgpu, so the whole tree must resolve to a
# single wgpu -- if it splits, the failure is a type mismatch between two
# identically named `wgpu::Device`s at the plugin boundary. See
# `crates/catchlight-bevy/src/lib.rs`.
wgpu = "29"

# Image processing
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "tga",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-chrome = "0.7"
wgpu-profiler = "0.27"

# Windowing
winit = "0.30"
pollster = "0.3"

# There is no unsafe anywhere, and the discipline that keeps it that way is
# derived `bytemuck::Pod` for every GPU-uploaded struct and no hand-written
# `Send`/`Sync`. Code that wants unsafe needs a different design, not an allow.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Size-optimized profile for a future wasm bundle. Kept separate so the
# default `release` profile stays untouched.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1

[project]
name = "catchlight"
version = "0.1.0"
description = "The catchlight editor protocol, and the client that speaks it"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
# None, deliberately. The wire is newline-delimited JSON and every type here is
# a dataclass, so an agent can drop this package next to whatever it already
# has without dragging a dependency tree in behind it.
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catchlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  # Waits out the editor's 30 s socket timeout for real. Skip with
  # `-m "not slow"` when a tight loop matters more than the proof.
  "slow: takes tens of seconds",
]
